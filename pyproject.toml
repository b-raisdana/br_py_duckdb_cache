[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "br-py-duckdb-cache"
version = "0.1.0"
description = "DuckDB-backed windowed cache with Parquet/ZSTD storage, gap-aware regeneration, and Iceberg datastore integration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "br-logging-and-profiling>=0.5.2,<1.0.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyiceberg>=0.7,<1.0.0",
    "duckdb>=1.1",
    "pandera[pandas]>=0.19,<1.0.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12,<1.0.0",
    "optree",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8,<4.0.0",
    "gitpython>=3.1,<4.0.0",
    "pytest>=8.2,<9.0.0",
    "pytest-asyncio>=0.23,<1.0.0",
    "pytest-cov>=5.0,<6.0.0",
    "ruff>=0.6,<1.0.0",
    "mypy>=1.11,<2.0.0",
    "types-requests>=2.31,<3.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "duckdb_cache",
    "duckdb_cache_helpers",
    "duckdb_cache_registry",
    "duckdb_reader",
    "duckdb_retention",
    "parquet_normalization",
]
packages = ["config", "helper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["unit: fast isolated unit tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*.ipynb", ".*venv", "archive_not_used_trash"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
strict = true
disallow_any_explicit = true
no_implicit_optional = true
warn_return_any = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = "(^|/)archive_not_used_trash/"

[tool.br_pre_commit.wrapper]
unknown-hook-policy = "error"
job-timeout-seconds = 900
protected-branches = ["main"]

[tool.br_pre_commit.ratchet]
target = "src"
max-lines = 300
line-growth-slack = 5
complexity-ranks = "ABCDEF"
xenon-max-absolute = "B"
exclude-dir = "archive_not_used_trash"
baseline-dir = ".br_pre_commit/ratchet"

[tool.br_pre_commit.backup]
full_backup_exclude_dir_regex = '^(data|logs|archive_not_used_trash|\.[^/]+)$'
